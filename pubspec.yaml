name: trucky
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.6.0
  go_router: ^17.2.3
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  flutter_barcode_scanner_plus: ^3.0.8
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/svgs/
    - assets/country_codes_currency.json

  fonts:
    - family: Inter-Regular
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
    - family: Inter-Bold
      fonts:
        - asset: assets/fonts/Inter-Bold.otf
    - family: Inter-SemiBold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.otf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto_regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
